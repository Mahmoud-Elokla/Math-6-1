   const put=ch=>{if(s.classList.contains("f")||!ch)return;if(ch.dataset.v==p[1]){s.classList.add("f");s.querySelector(".z").innerHTML=f(p[1]);ch.remove();sel=null;ok();if(++n==X.dr.length){toast("🏅 أحسنت!");conf()}}else{s.classList.add("sk");setTimeout(()=>s.classList.remove("sk"),400);toast("ليس هنا 🙂")}};
   s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();put([...pool.children].find(x=>x.dataset.v==e.dataTransfer.getData("t")))};s.onclick=()=>put(sel);c.appendChild(s)});
  sh(X.dr.map(p=>p[1])).forEach(a=>{const h=document.createElement("span");h.className="ch";h.draggable=true;h.dataset.v=a;h.innerHTML=f(a);h.ondragstart=e=>e.dataTransfer.setData("t",a);h.onclick=()=>{pool.querySelectorAll(".ch").forEach(x=>x.classList.remove("s"));sel=h;h.classList.add("s")};pool.appendChild(h)});
  c.appendChild(pool);v.appendChild(c)}}
let rot=0,spin=0;
function wh(v){const L=["الوحدة 1","الوحدة 2","الوحدة 3","الوحدة 4","+10 🎁","+5 🎁"],C=["#6c4cf1","#0aa6c8","#f08a1c","#e0457b","#19a974","#f5b82e"];
 let s="";for(let i=0;i<6;i++){const a=i*60*Math.PI/180,b=(i+1)*60*Math.PI/180,m=(i*60+30)*Math.PI/180;
  s+=`<path d="M100 100L${100+95*Math.sin(a)} ${100-95*Math.cos(a)}A95 95 0 0 1 ${100+95*Math.sin(b)} ${100-95*Math.cos(b)}Z" fill="${C[i]}"/><text x="${100+62*Math.sin(m)}" y="${100-62*Math.cos(m)}" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(${i*60+30} ${100+62*Math.sin(m)} ${100-62*Math.cos(m)})">${L[i]}</text>`}
 const c=el(`<div class="ptr">▼</div><svg id="wh" viewBox="0 0 200 200" style="transform:rotate(${rot}deg)">${s}</svg>`);
 const b=document.createElement("button");b.className="pri";b.textContent="🎡 أدِر العجلة";b.style.cssText="display:block;margin:auto";const q=el("","");
 b.onclick=()=>{if(spin)return;spin=1;q.innerHTML="";rot+=1440+Math.random()*360|0;$("#wh").style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{spin=0;const i=Math.floor(((360-rot%360)%360)/60);
   if(i<4){q.appendChild(el(`<b>سؤال من ${L[i]} – ${U[i].n}</b>`));const X=U[i];q.appendChild(qEl(sh([...mcs(X),...tfs(X)])[0]))}
   else{const n=i==4?10:5;add(n);toast("🎁 +"+n+" نقاط");conf();q.appendChild(el(`<div class="big">🎁 +${n}</div>`))}},4100)};
 c.appendChild(b);v.append(c,q)}
let F=null;
function fin(v){if(!F){const c=el(`<div class="big">📝</div><h3>التقويم النهائي</h3><p>١٢ سؤالًا من الوحدات الأربع مع تصحيح فوري. ٣ نجوم لمن يحقق ٩٠٪ فأكثر!</p>${S.best?`<p>أفضل نتيجة: ${"⭐".repeat(S.best>3?3:S.best)}</p>`:""}`),b=document.createElement("button");b.className="pri";b.textContent="ابدأ التقويم";
  b.onclick=()=>{let Q=[];U.forEach(X=>Q.push(...sh(mcs(X)).slice(0,2),sh(tfs(X))[0]));F={Q:sh(Q),i:0,s:0};render()};c.appendChild(b);v.appendChild(c);return}
 if(F.i>=F.Q.length){const p=Math.round(F.s/F.Q.length*100),st=p>=90?3:p>=60?2:1;if(st>(S.b||0)){S.b=st;save()}
  const c=el(`<div class="big">${"⭐".repeat(st)}</div><h3 style="text-align:center">نتيجتك ${F.s} / ${F.Q.length} (${p}٪)</h3><p style="text-align:center">${p>=90?"أنت بطل الرياضيات! 🏆":p>=60?"أداء جيد، راجع الدروس وحاول مجددًا 💪":"لا تقلق، راجع الدروس وجرّب الأنشطة ثم أعد المحاولة 📚"}</p>`);conf();
  const b=document.createElement("button");b.className="pri";b.textContent="إعادة التقويم";b.onclick=()=>{F=null;render()};c.appendChild(b);v.appendChild(c);head();return}
 const x=F.Q[F.i];v.appendChild(el(`<div class="bar"><i style="width:${F.i/F.Q.length*100}%"></i></div><small>السؤال ${F.i+1} من ${F.Q.length}</small>`));
 const nx=document.createElement("button");nx.className="pri";nx.textContent=F.i==F.Q.length-1?"عرض النتيجة":"التالي ◀";nx.style.display="none";nx.onclick=()=>{F.i++;render()};
 v.appendChild(qEl(x,r=>{r&&F.s++;nx.style.display="block"}));v.appendChild(nx)}
render();
